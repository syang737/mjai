[project]
name = "mjbot"
version = "0.0.1"
description = "Riichi mahjong AI research: belief-tensor state representation, SL/RL training"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "riichienv==0.4.9", "torch>=2.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mjbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
